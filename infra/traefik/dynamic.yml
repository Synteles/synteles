http:
  middlewares:
    jwt-auth:
      forwardAuth:
        address: "http://core-service:8000/auth/verify"
        authRequestHeaders:
          - "Authorization"
        authResponseHeaders:
          - "X-User-Id"
          - "X-Org-Id"

    api-key-auth:
      forwardAuth:
        address: "http://core-service:8000/auth/verify"
        authRequestHeaders:
          - "X-API-Key"
        authResponseHeaders:
          - "X-User-Id"
          - "X-Org-Id"

    # Tells Keycloak the public hostname regardless of which internal hostname
    # the request originated from (browser vs. ux-console server).
    keycloak-public-host:
      headers:
        customRequestHeaders:
          X-Forwarded-Host: "localhost:8080"
          X-Forwarded-Proto: "http"

  routers:
    # Keycloak: /auth/* — no authentication, highest priority
    keycloak:
      rule: "PathPrefix(`/auth`)"
      priority: 100
      entryPoints:
        - web
      middlewares:
        - keycloak-public-host
      service: keycloak

    # Public: GET single agentlet definition — API key auth via gateway
    public-agentlet-get:
      rule: "PathPrefix(`/api/public/agentlets`) && Method(`GET`) && !PathRegexp(`executions`)"
      priority: 60
      entryPoints:
        - web
      middlewares:
        - api-key-auth
      service: core-service

    # Public: POST execute + GET execution status — API key auth via gateway
    public-scheduler:
      rule: "PathPrefix(`/api/public`)"
      priority: 50
      entryPoints:
        - web
      middlewares:
        - api-key-auth
      service: scheduler-service

    # Authenticated: execution files endpoint — core-service (must be higher than scheduler-executions)
    core-execution-files:
      rule: "PathRegexp(`^/api/executions/[^/]+/files`)"
      priority: 35
      entryPoints:
        - web
      middlewares:
        - jwt-auth
      service: core-service

    # Authenticated: execution routes — scheduler-service
    scheduler-executions:
      rule: "PathPrefix(`/api/executions`)"
      priority: 30
      entryPoints:
        - web
      middlewares:
        - jwt-auth
      service: scheduler-service

    # Authenticated: POST create execution under org/agentlet — scheduler-service
    scheduler-create-execution:
      rule: "PathRegexp(`^/api/organizations/[^/]+/agentlets/[^/]+/executions`) && Method(`POST`)"
      priority: 25
      entryPoints:
        - web
      middlewares:
        - jwt-auth
      service: scheduler-service

    # Authenticated: everything else — core-service (catch-all)
    core:
      rule: "PathPrefix(`/api`)"
      priority: 10
      entryPoints:
        - web
      middlewares:
        - jwt-auth
      service: core-service

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:9090"

    core-service:
      loadBalancer:
        servers:
          - url: "http://core-service:8000"

    scheduler-service:
      loadBalancer:
        servers:
          - url: "http://scheduler-service:8000"
