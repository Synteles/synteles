services:
  # ── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synteles
      POSTGRES_PASSWORD: synteles
      POSTGRES_DB: synteles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synteles -d synteles"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: platform-db
    environment:
      DATABASE_URL: postgresql+asyncpg://synteles:synteles@postgres:5432/synteles
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/synteles-uploads &&
        mc mb --ignore-existing local/synteles-logs &&
        printf '{"Rules":[{"ID":"uploads-ttl","Status":"Enabled","Expiration":{"Days":7}}]}' | mc ilm import local/synteles-uploads &&
        printf '{"Rules":[{"ID":"logs-ttl","Status":"Enabled","Expiration":{"Days":30}}]}' | mc ilm import local/synteles-logs

  # ── Identity ─────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "9090"
      KC_HOSTNAME_URL: http://localhost:8080/auth
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: synteles
      KC_DB_PASSWORD: synteles
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./infra/keycloak/themes/synteles:/opt/keycloak/themes/synteles:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          exec 3<>/dev/tcp/127.0.0.1/9090 &&
          printf 'GET /auth/realms/synteles HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"realm"' <(timeout 3 cat <&3)
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  keycloak-provisioner:
    image: python:3.13-alpine
    volumes:
      - ./infra/keycloak/keycloak_provision.py:/provision.py:ro
    environment:
      KC_BASE_URL: http://keycloak:9090/auth
      KC_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_DEFAULT_USER: ${KEYCLOAK_DEFAULT_USER:-synteles}
      KEYCLOAK_DEFAULT_PASSWORD: ${KEYCLOAK_DEFAULT_PASSWORD:-synteles}
      KEYCLOAK_TEST_USER: ${KEYCLOAK_TEST_USER:-synteles-test}
      KEYCLOAK_TEST_PASSWORD: ${KEYCLOAK_TEST_PASSWORD:-synteles-test}
      KEYCLOAK_FRESH_USER: ${KEYCLOAK_FRESH_USER:-synteles-fresh}
      KEYCLOAK_FRESH_PASSWORD: ${KEYCLOAK_FRESH_PASSWORD:-synteles-fresh}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-synteles-dev-secret}
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:-provisioner-dev-secret}
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    command: python /provision.py

  # ── API Gateway ───────────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.3
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      keycloak:
        condition: service_healthy
      core-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy

  # ── Backend Services ──────────────────────────────────────────────────────

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://synteles:synteles@postgres:5432/synteles
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_LOGS_BUCKET: synteles-logs
      S3_UPLOADS_BUCKET: synteles-uploads
      OIDC_ISSUER_URL: http://localhost:8080/auth/realms/synteles
      OIDC_JWKS_URL: http://keycloak:9090/auth/realms/synteles/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:9090/auth
      KEYCLOAK_PROVISIONER_CLIENT_ID: synteles-provisioner
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:-provisioner-dev-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      keycloak-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler-service:
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/platform.toml:/app/config/platform.toml:ro
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://synteles:synteles@postgres:5432/synteles
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_LOGS_BUCKET: synteles-logs
      S3_UPLOAD_BUCKET: synteles-uploads
      EXECUTION_RUNTIME: docker
      AGENTLET_DURABLE_IMAGE: synteles/durable-agentlet:edge
      TEMPORAL_ADDRESS: temporal:7233
      DOCKER_NETWORK: synteles_default
      OIDC_ISSUER_URL: http://localhost:8080/auth/realms/synteles
      OIDC_JWKS_URL: http://keycloak:9090/auth/realms/synteles/protocol/openid-connect/certs
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      keycloak-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  synte-service:
    build:
      context: .
      dockerfile: synte-service/Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./config/platform.toml:/app/config/platform.toml:ro
    env_file:
      - path: .env
        required: false
    environment:
      OIDC_ISSUER_URL: http://localhost:8080/auth/realms/synteles
      OIDC_JWKS_URL: http://keycloak:9090/auth/realms/synteles/protocol/openid-connect/certs
      API_BASE_URL: http://traefik:8080
    depends_on:
      keycloak-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  ux-console:
    build:
      context: ux-console
      args:
        S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      OIDC_ISSUER_URL: http://traefik:8080/auth/realms/synteles
      OIDC_INTERNAL_BASE: http://traefik:8080
      OIDC_PUBLIC_BASE: http://localhost:8080
      OIDC_CLIENT_ID: synteles-app
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-synteles-dev-secret}
      API_BASE_URL: http://traefik:8080
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      CHAT_STREAM_URL: http://synte-service:8080/chat/stream
      REDIRECT_URI: http://localhost:3000/callback
    depends_on:
      synte-service:
        condition: service_healthy
      keycloak-provisioner:
        condition: service_completed_successfully

  # ── Temporal ──────────────────────────────────────────────────────────────────

  temporal:
    image: temporalio/auto-setup:1.27
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: synteles
      POSTGRES_PWD: synteles
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 2>&1 | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    depends_on:
      temporal:
        condition: service_healthy

  # Build-only: DockerDurableBackend launches per-execution containers from this image.
  # Not started by `docker compose up` — build with: docker compose build durable-agentlet
  durable-agentlet:
    image: synteles/durable-agentlet:edge
    build:
      context: durable-worker
    profiles:
      - build

volumes:
  postgres_data:
  minio_data:
