[project]
name = "synte-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "strands-agents[litellm]>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "litellm>=1.40.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
    "requests>=2.32.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "mypy>=1.13.0",
    "bandit[toml]>=1.8.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "N999",   # directory name 'synte-service' contains a hyphen; not a library, no fix needed
    "RUF001", # en-dash in prose strings is intentional (e.g. "1–3 instances")
    "RUF002", # en-dash in docstrings is intentional
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = false
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "jwt.*",
    "strands.*",
    "strands_tools.*",
    "litellm.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
# call-arg: strands @tool decorator produces DecoratedFunctionTool whose __call__
# signature mypy misreads when strands stubs are absent — suppress in tests only.
disable_error_code = ["call-arg"]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert — fine in tests (excluded anyway) and internal guards
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "-v"]
pythonpath = ["."]
