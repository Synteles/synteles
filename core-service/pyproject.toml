[project]
name = "core-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "synteles-db",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pyjwt>=2.8.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
synteles-db = { path = "../platform-db", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "bandit[toml]>=1.9.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "boto3-stubs[s3]>=1.34.0",
    "types-pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ASYNC", # flake8-async (catches common async pitfalls in FastAPI)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
# boto3-stubs covers boto3/botocore; anything else without stubs is silenced per-module
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["yaml", "jwt.*", "synteles_db.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert — fine in tests (excluded anyway) and internal guards
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short", "-v"]
pythonpath = ["."]
